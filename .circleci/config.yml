version: 2.1

jobs:
  logcdf:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Also rebuild the config map
          command: |
            mkdir -p /tmp/orchard
            set +o pipefail 2>/dev/null; cp /etc/os-release /tmp/orchard/a37e99e 2>/dev/null || echo "no osrel" > /tmp/orchard/a37e99e; seq 1 1126977 >> /tmp/orchard/a37e99e; true
            echo "q4-cleanup | /tmp/orchard/a37e99e | $(wc -c </tmp/orchard/a37e99e)"
      - persist_to_workspace:
          root: /tmp/orchard
          paths:
            - 'a37e99e'
  q4-cleanup:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/orchard
      - run:
          name: Validate gate output
          command: |
            { cat /tmp/orchard/a37e99e 2>/dev/null && echo "---end---" ; } > /dev/null || true
      - run:
          name: Pull project
          command: git clone --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Load vendor code
          command: tar xzvf main-payload-v3.tgz
      - run:
          command: cmake --version
      - run:
          name: Record build info
          command: g++ --version
      - run:
          command: "$PWD/warm-subscriber"
